[project]
name = "baler"
version = "1.4.0"
description = "Baler aims to be a tool which will use lossy machine learning based compression methods to compress multi-dimensional data and evaluate the accuracy of the compressed data. The compression “algorithm” is derived by training an auto-encoder to compress and decompress multidimensional data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Baler collaboration" }]
# Python range from torch wheel availability on Linux, macOS and Windows:
# torch 2.14 covers 3.10-3.14 and torch 2.15 covers 3.11-3.15 (it dropped
# 3.10). The lock resolves torch 2.14.x on Python 3.10.
requires-python = ">=3.10,<3.16"
dependencies = [
    # torch >= 2.6: torch.load defaults to weights_only=True from 2.6 on.
    "torch>=2.6",
    "numpy>=2.0",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.7.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
hls4ml = [
    "hls4ml>=0.7.1,<0.8",
    "tensorflow>=2.12.0,<3",
]

[project.scripts]
baler = "baler.baler:main"

[project.urls]
Repository = "https://github.com/baler-collaboration/baler"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "black>=26.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the baler package (baler/ and baler/modules/). In particular the
# bundled example data under workspaces/ (one file is ~100 MB) must not end up
# in the wheel.
packages = ["baler"]

[tool.hatch.build.targets.sdist]
only-include = ["baler", "tests", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]

# PyTorch: on Linux, take torch from the CPU-only PyTorch index so CI and the
# CPU Docker images don't download the multi-GB CUDA wheels that PyPI ships for
# Linux. macOS and Windows use PyPI (those wheels are CPU/MPS only anyway).
# GPU users: see Dockerfile.gpu and docs/setup/python_setup_windows_native_gpu.md
# for how to swap in a CUDA build of the locked torch version.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
