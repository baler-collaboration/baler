name: Code-Quality

# Stopgap after the poetry -> uv migration: same two jobs as before, with the
# install steps switched to uv. To be replaced by the full uv-based CI
# (lint, unit matrix, round-trip job) in a later phase.

on: [pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: "checkout repository"
        uses: actions/checkout@v7

      - name: "set up uv and python"
        uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "install dependencies"
        run: uv sync --locked

      - name: "run syntax check"
        run: |
          ./bin/syntax.sh

  test:
    runs-on: ubuntu-latest

    steps:
      - name: "checkout repository"
        uses: actions/checkout@v7

      - name: "set up uv and python"
        uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "install dependencies"
        run: uv sync --locked

      - name: "set python path"
        run: echo "PYTHONPATH=.:baler" >> $GITHUB_ENV

      - name: "run tests"
        run: |
          ./bin/tests.sh
